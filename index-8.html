<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>KAÇAK – Polis Kovalamacası</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d1019;--ink:#eef1f8;--mute:#8b93a8;--acc:#ff8a1f;--red:#ff2e4d;--blue:#2e7bff}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Barlow Condensed','Arial Narrow',sans-serif}
canvas#g{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);background:linear-gradient(rgba(13,16,25,.72),rgba(13,16,25,.93));text-align:center}
h1,h2{font-family:Bungee,Impact,sans-serif;margin:0;font-weight:400;letter-spacing:1px}
h1{font-size:68px;line-height:1;animation:sir 1.2s steps(1) infinite}
@keyframes sir{0%{text-shadow:-4px 0 var(--red),4px 0 var(--blue)}50%{text-shadow:-4px 0 var(--blue),4px 0 var(--red)}}
h2{font-size:34px;color:var(--red)}
.sub{margin:0;color:var(--mute);font-size:19px}
#pv{width:240px;height:110px}
#sw{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:300px}
#sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px #2a3042}
#sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.modes{display:flex;gap:10px;width:100%;max-width:340px}
.modes button{flex:1;padding:12px 8px;border-radius:14px;background:#171c2b;border:2px solid #2a3042;display:flex;flex-direction:column;gap:2px}
.modes b{font-size:24px}.modes span{font-size:15px;color:var(--mute)}
.modes button.on{border-color:var(--acc);background:#2a1d16}
.cta{font-family:Bungee,Impact,sans-serif;font-size:24px;background:var(--acc);color:#1a0d02;padding:14px 44px;border-radius:16px}
.ghost{font-family:Bungee,Impact,sans-serif;font-size:18px;background:#171c2b;border:2px solid #2a3042;padding:12px 26px;border-radius:14px;margin-left:8px}
#best{color:var(--mute);font-size:17px}
#res{font-size:26px;line-height:1.35}#res b{color:var(--acc);font-size:44px;display:block}
#hud .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none}
#sc{font-family:Bungee,Impact,sans-serif;font-size:34px;display:block;line-height:1}
#cb{color:var(--acc);font-size:22px;font-weight:700;height:24px;display:block}#fx{display:block;font-size:22px;font-weight:700}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:20px;font-weight:700}
.bar{width:120px;height:12px;border-radius:6px;background:#242a3b;overflow:hidden}.bar i{display:block;height:100%;width:100%}
#mm{width:80px;height:80px;border-radius:8px;border:2px solid #2a3042}
.ctl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(env(safe-area-inset-right,0px) + 22px) 16px calc(env(safe-area-inset-left,0px) + 22px)}
.ctl button{width:112px;height:112px;border-radius:50%;background:rgba(238,241,248,.13);border:2px solid rgba(238,241,248,.28);font-size:42px;backdrop-filter:blur(3px)}
.ctl button.d{background:rgba(255,138,31,.45)}
#pb{pointer-events:auto;width:42px;height:34px;border-radius:10px;background:rgba(238,241,248,.15);border:2px solid rgba(238,241,248,.4);font-family:Bungee,Impact,sans-serif;font-size:16px;color:var(--ink)}
.kitty #pb{background:rgba(255,255,255,.6);border-color:#ff4f9a;color:#c2185b}
#lbl{display:flex;gap:30px;font-size:20px;line-height:1.35;text-align:left;min-width:240px}#lbl .me{color:var(--acc)}
#mpc{width:96px;text-transform:uppercase;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:20px;background:#171c2b;color:var(--ink);border:2px solid #2a3042;border-radius:10px;padding:7px;user-select:text;-webkit-user-select:text}
#pls{white-space:pre;font-size:16px;text-align:right;font-weight:600}#onl{max-width:none;justify-content:center}
body.kitty{--ink:#5a1f3d;--mute:#b0608a;--acc:#ff4f9a}
.kitty .scr{background:linear-gradient(rgba(255,226,240,.8),rgba(255,190,218,.94))}
.kitty .modes button,.kitty .opt button,.kitty .ghost{background:#fff;border-color:#ffb3d1}
.kitty .modes button.on,.kitty .opt button.on{background:#ffe0ef;border-color:var(--acc)}
.kitty .cta{color:#fff}.kitty h1{animation:none;text-shadow:-4px 0 #ffb3d1,4px 0 #ff4f9a}
.kitty .ctl button{background:rgba(255,255,255,.5);border-color:#ff4f9a;color:#c2185b}.kitty .bar{background:#fff}
.kitty #swb{background:#fff;color:#c2185b;border-color:#ff4f9a}
#swb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-family:Bungee,Impact,sans-serif;font-size:16px;padding:14px 20px;border-radius:16px;background:#0b2a3a;border:2px solid #0ac8ff;color:#d9f6ff;z-index:3}
.opt{display:flex;gap:6px;width:100%;max-width:340px;align-items:center}.opt i{font-style:normal;color:var(--mute);font-size:17px;width:62px;text-align:left}.opt button{flex:1;padding:7px 4px;border-radius:10px;background:#171c2b;border:2px solid #2a3042;font-size:19px;font-weight:700}.opt button.on{border-color:var(--acc);background:#2a1d16}
#rot{position:fixed;inset:0;z-index:9;background:#0d1019;display:none;align-items:center;justify-content:center;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:26px;line-height:1.7}
@media(orientation:portrait){#rot{display:flex}}
@media(max-height:520px){#lobby{display:grid;grid-template-columns:1fr 1fr;align-content:center;justify-items:center;align-items:center;column-gap:24px;row-gap:6px}#lobby h1{font-size:46px;grid-column:1;grid-row:1}#lobby .sub{grid-column:1;grid-row:2;font-size:17px}#pv{grid-column:1;grid-row:3/7}#sw{grid-column:2;grid-row:1;max-width:none;flex-wrap:nowrap;gap:6px}#sw button{width:26px;height:26px}.modes{grid-column:2;grid-row:2}.modes button{padding:5px 8px}.modes span{display:none}#theme{grid-column:2;grid-row:3}#diff{grid-column:2;grid-row:4}#maps{grid-column:2;grid-row:5}#go{grid-column:2;grid-row:6;padding:8px 40px;font-size:20px}#best{grid-column:2;grid-row:7}#onl{grid-column:1;grid-row:7}.opt button{padding:4px;font-size:17px}h2{font-size:28px}#res{font-size:22px}#res b{font-size:38px}}
@media(prefers-reduced-motion:reduce){h1{animation:none;text-shadow:-4px 0 var(--red),4px 0 var(--blue)}}
</style>
</head>
<body>
<canvas id="g"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div><b id="sc">0</b><span id="cb"></span><span id="fx"></span></div>
    <div class="r"><button id="pb">P</button><span id="lv">★ 1</span><div class="bar"><i id="hp"></i></div><canvas id="mm" width="80" height="80"></canvas><span id="pls"></span></div>
  </div>

  <div id="diff" class="opt"><i>Zorluk</i><button data-d="easy">Kolay</button><button data-d="normal" class="on">Normal</button><button data-d="hard">Zor</button></div>
  <div id="maps" class="opt"><i>Harita</i><button data-p="city" class="on">Şehir</button><button data-p="ind">Sanayi</button><button data-p="sub">Mahalle</button></div>
  <button id="go" class="cta">BAŞLA</button>
  <small id="best"></small>
  <div id="onl" class="opt"><button id="lbBtn">🏆 Sıralama</button><button id="mpBtn">👥 Çok oyunculu</button></div>
</div>

<div id="over" class="scr" hidden>
  <h2>ARABAN PATLADI</h2>
  <div id="res"></div>
  <div><button id="again" class="cta">TEKRAR</button><button id="tolobby" class="ghost">LOBİ</button><button id="overlb" class="ghost">🏆 SIRALAMA</button></div>
</div>

<div id="pz" class="scr" hidden><h2 style="color:var(--ink)">DURAKLATILDI</h2><button id="pzc" class="cta">DEVAM ET</button><div><button id="pzb" class="ghost">🏆 SIRALAMA</button><button id="pzl" class="ghost">LOBİYE DÖN</button></div></div>
<div id="lb" class="scr" hidden><h2 style="color:var(--ink)">DÜNYA SIRALAMASI</h2><div id="lbl"></div><button id="lbx" class="ghost">KAPAT</button></div>
<div id="mp" class="scr" hidden><h2 style="color:var(--ink)">ÇOK OYUNCULU</h2><p class="sub">Aynı kodu girenler aynı haritada birlikte kaçar.<br>Mod, zorluk ve harita lobiden alınır.</p><div class="opt" style="justify-content:center"><input id="mpc" maxlength="4" placeholder="KOD" autocomplete="off"><button id="mpj">Katıl</button><button id="mpn">Oda aç</button></div><div id="mps" class="sub"></div><div><button id="mpgo" class="cta" hidden>BAŞLAT</button><button id="mpx" class="ghost">KAPAT</button></div></div>
<div id="rot"><div>↻<br>Telefonu yan çevir</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$('g'),cx=cv.getContext('2d'),pvx=$('pv').getContext('2d'),mmx=$('mm').getContext('2d');
let W,H,dpr;function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}addEventListener('resize',rs);rs();
const COLORS=['#ff3b30','#ff9f0a','#ffd60a','#30d158','#0ac8ff','#3d6bff','#bf5af2','#f2f2f7'];
let color=COLORS[0],mode='normal',best={normal:0,drift:0};
try{best=Object.assign(best,JSON.parse(localStorage.getItem('kacak')||'{}'))}catch(e){}
const WS=5000,R=13;
let blocks=[],bars=[],pl,polices=[],parts=[],marks=[],texts=[];
let st='lobby',t=0,t2=0,score=0,kills=0,chain=0,chainT=0,lvl=1,shake=0,deadT=0,spawnCd=0,hpw=0,pkCd=8,pickups=[],peds=[],bullets=[],pdCd=1,mines=[],mnCd=2,swTgt=null,swT=0,ptype='normal',pcol='#fff';
const cam={x:WS/2,y:WS/2,s:1},inp={l:0,r:0,hb:0,brk:0};
const PN={acc:290,brk:550,drag:.35,max:320,g:5.5,hg:2.4,turn:3.7,scrub:.5},PD={acc:290,brk:550,drag:.35,max:320,g:2.2,hg:.9,turn:4.0,scrub:.35},PP={acc:260,brk:460,drag:.35,max:260,g:6,hg:6,turn:3.3,scrub:.5};

/* ---------- world ---------- */
const MAPS={
  city:{nm:'Şehir Merkezi',av:.22,bs:[230,140],pk:.12,lt:.08,op:.18,kp:.72,dp:2,rx:0,rd:'#1a1f2e',sw:'#303750',gr:'#262d40',pal:['#2a3148','#303851','#352c46','#26394c','#3a3340','#2c3a3a','#41364a']},
  ind:{nm:'Sanayi',av:.3,bs:[320,160],pk:.03,lt:.22,op:.2,kp:.85,dp:1,rx:14,rd:'#1e2026',sw:'#383a40',gr:'#2c2e34',pal:['#3b3d44','#46423b','#3a4249','#4b4640','#33363c']},
  sub:{nm:'Mahalle',av:.08,bs:[190,100],pk:.3,lt:.05,op:.15,kp:.65,dp:3,rx:4,rd:'#222530',sw:'#3a4056',gr:'#2d3a33',pal:['#4a3b3b','#3f4a3f','#4a4538','#3a4553','#4f3f4a']}};
let mp='city',MP=MAPS.city,diff='normal';
let theme='normal';
const TH={n:{bg:'#0d1019',yel:'#d9a21b',dash:'#4a5168',zeb:'rgba(235,238,245,.55)',shd:'rgba(0,0,0,.35)',pk:'#1d4a33',pp:'#3e6d52',t1:'#2c6b47',t2:'#3a8057',lot:'#232838',stripe:'rgba(235,238,245,.35)',roof:'rgba(255,255,255,.05)',wnd:'rgba(255,200,120,.2)',stop:'#2e6bd1',bin1:'#245f3c',bin2:'#3fa066'},
 k:{bg:'#ffe4f0',yel:'#fff27a',dash:'#ffffff',zeb:'rgba(255,255,255,.9)',shd:'rgba(120,40,80,.28)',pk:'#ffb3d1',pp:'#ffffff',t1:'#ff8fbd',t2:'#ffc2dc',lot:'#f2c6da',stripe:'rgba(255,255,255,.8)',roof:'rgba(255,255,255,.28)',wnd:'rgba(255,255,255,.65)',stop:'#ff6fb0',bin1:'#ff7eb6',bin2:'#ffc2dc'}};
const KP={rd:'#e3a2c2',sw:'#fff0f6',gr:'#ffd9ea',pal:['#ff9ec7','#ffc2dc','#fff0f6','#ff85b8','#f7b6d2','#ffffff','#ffadd2']};
let T=TH.n;
const PS={
 sA:['..HHH.','.HHHS.','..SSS.','..BBB.','.BBBB.','.BBBB.','..BBB.','..PPP.','.PP.PP','.O..OO'],
 sB:['..HHH.','.HHHS.','..SSS.','..BBB.','.BBBB.','.BBBB.','..BBB.','..PPP.','..PP..','..OO..'],
 fA:['..HH..','.HHHH.','.SSSS.','BBBBBB','SBBBBS','.BBBB.','.BBBB.','.PPPP.','.PP.P.','.OO.O.'],
 fB:['..HH..','.HHHH.','.SSSS.','BBBBBB','SBBBBS','.BBBB.','.BBBB.','.PPPP.','.P.PP.','.O.OO.'],
 bA:['..HH..','.HHHH.','.HHHH.','BBBBBB','SBBBBS','.BBBB.','.BBBB.','.PPPP.','.PP.P.','.OO.O.'],
 bB:['..HH..','.HHHH.','.HHHH.','BBBBBB','SBBBBS','.BBBB.','.BBBB.','.PPPP.','.P.PP.','.O.OO.']};
const SKN=['#f1c9a5','#d9a06f','#a86b45','#7a4a2e'],HAR=['#3b2a20','#1f1a17','#c9a227','#8a4b2d','#cfcfcf'];
function drawPed(c,q){
  const id=q.id||(q.id=Math.random()),k=(id*1000)|0,mx=Math.abs(q.vx)>=Math.abs(q.vy),fr=((t*6+id*10)|0)&1;
  const P=mx?(fr?PS.sB:PS.sA):q.vy>0?(fr?PS.fB:PS.fA):(fr?PS.bB:PS.bA),flip=mx&&q.vx<0,u=1.7,x0=q.x-3*u,y0=q.y-10*u+3-(fr?0:1);
  const col={H:HAR[(k>>2)%5],S:SKN[k%4],B:q.c,P:'#2a3042',O:'#111'};
  c.globalAlpha=Math.min(1,q.l/.6);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(q.x,q.y+3,5,2.2,0,0,6.28);c.fill();
  for(let j=0;j<10;j++)for(let i=0;i<6;i++){const ch=P[j][flip?5-i:i];if(ch!=='.'){c.fillStyle=col[ch];c.fillRect(x0+i*u,y0+j*u,u+.2,u+.2)}}
  c.globalAlpha=1}
function mpSet(){MP=theme==='kitty'?Object.assign({},MAPS[mp],KP):MAPS[mp]}
const KC={W:'#fff',K:'#6b3b52',Y:'#ffd23f',R:'#ff4f9a'};
const KAT=['WW.....WWRR','WWW...WWWRR','WWWWWWWWWWW','WWKWWWWWKWW','WWWWWYWWWWW','KWWWWWWWWWK','WWWWWWWWWWW','.WWWWWWWWW.'];
const HRT=['.R.R.','RRRRR','RRRRR','.RRR.','..R..'];
const BOW=['RR.....RR','RRR...RRR','RRRRYRRRR','RRR...RRR','RR.....RR'];
function pix(c,P,u,x,y){for(let j=0;j<P.length;j++)for(let i=0;i<P[j].length;i++){const k=P[j][i];if(k!=='.'){c.fillStyle=KC[k];c.fillRect(x+i*u,y+j*u,u+.2,u+.2)}}}
const DFS={easy:{pc:.75,sp:.92,dm:.7,lv:26,sm:.8,fr:1.4,sc:.6,mn:.6,ns:10},normal:{pc:1,sp:1,dm:1,lv:20,sm:1,fr:1,sc:.35,mn:1,ns:6},hard:{pc:1.35,sp:1.06,dm:1.3,lv:14,sm:1.3,fr:.75,sc:.12,mn:1.4,ns:3}};
let DF=DFS.normal;const TYS={normal:{nm:'Normal',sp:1,tn:1,dm:1,s:1},sport:{nm:'Spor',sp:1.12,tn:1.08,dm:1.3,s:.97},suv:{nm:'Zırhlı Jip',sp:.9,tn:.9,dm:.65,s:1.12}};
let OL={db:null,user:null,room:null,uid:null,rm:null,code:'',host:false,peers:[],gh:{},names:{},lastGo:0};let rx=[],ry=[],rb=[];
const rc=a=>a[Math.random()*a.length|0].c;
function mkRoads(){const o=[];let p=0;
  while(p<WS-300){const av=Math.random()<MP.av,w=av?300:200+Math.random()*50,bs=MP.bs[0]+Math.random()*MP.bs[1];if(!av&&o.length&&Math.random()<.25){p+=w+bs;continue}o.push({a:p,b:p+w,av});p+=w+bs}
  o.push({a:p,b:p+200,av:false});const k=WS/(p+200);o.forEach(r=>{r.a*=k;r.b*=k;r.c=(r.a+r.b)/2});return o}
function gen(){rx=mkRoads();ry=mkRoads();blocks=[];bars=[];
  const pal=MP.pal;
  function split(L,x,y,w,h,d){if(d<=0||Math.max(w,h)<120||(d<2&&Math.random()<.25)){L.push({x:x+3,y:y+3,w:w-6,h:h-6,c:pal[Math.random()*pal.length|0],u:Math.random()});return}
    const r=.35+Math.random()*.3;if(w>h){split(L,x,y,w*r,h,d-1);split(L,x+w*r,y,w*(1-r),h,d-1)}else{split(L,x,y,w,h*r,d-1);split(L,x,y+h*r,w,h*(1-r),d-1)}}
  for(let i=0;i<rx.length-1;i++){blocks[i]=[];for(let j=0;j<ry.length-1;j++){
    const x=rx[i].b,y=ry[j].b,w=rx[i+1].a-x,h=ry[j+1].a-y,q=Math.random(),b={x,y,w,h};

    else if(q<MP.pk+MP.lt){b.k='lot';b.col=[];b.pc=[];for(let sx=x+14;sx<x+w-30;sx+=24){if(Math.random()<.5)b.pc.push({x:sx+13,y:y+32,h:Math.PI/2,c:COLORS[Math.random()*8|0]});if(Math.random()<.5)b.pc.push({x:sx+13,y:y+h-32,h:-Math.PI/2,c:COLORS[Math.random()*8|0]})}}
    else if(q<MP.pk+MP.lt+MP.op){b.k='open';b.sub=[];b.col=[]}
    else{b.k='b';b.sub=[];const mg=10+Math.random()*40;split(b.sub,x+mg,y+mg,w-2*mg,h-2*mg,MP.dp+(Math.random()<.5?1:0));b.sub=b.sub.filter(()=>Math.random()<MP.kp);b.col=b.sub}
    blocks[i][j]=b}}
  const sx=rx[rx.length>>1].c,sy=ry[ry.length>>1].c;
  rb=[];for(let k=0;k<110+MP.rx;k++){const hor=Math.random()<.5,A=hor?ry:rx,O=hor?rx:ry,r=A[Math.random()*A.length|0],b=60+Math.random()*(WS-120),x=hor?b:r.c,y=hor?r.c:b;if(O.some(o=>b>o.a-70&&b<o.b+70)||Math.hypot(x-sx,y-sy)<700)continue;addThing(hor,r,b,k<85);
    }}

const SB='https://robwshjtskvfudqqdsrm.supabase.co',SK='sb_publishable_XSDEO8yEclz8SGL_UTSKSQ_hZBRC64O',TB=SB+'/rest/v1/kacak_scores';
const sbh={apikey:SK,'Content-Type':'application/json'};
function myUid(){let u='';try{u=localStorage.getItem('kacak_uid')||''}catch(e){}if(u.length<8){u='p'+Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('kacak_uid',u)}catch(e){}}return u}
function myName(ask){let n='';try{n=localStorage.getItem('kacak_name')||''}catch(e){}
  if(!n&&ask){n=(prompt('Sıralama için takma adın (en fazla 16 harf):')||'').trim().slice(0,16);if(n){try{localStorage.setItem('kacak_name',n)}catch(e){}}}return n}
async function sbJoin(name){
  const nm=myName(true)||'Oyuncu',key=myUid(),sb=(window.supabase||await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm')).createClient(SB,SK,{realtime:{params:{eventsPerSecond:20}}});
  const ch=sb.channel(name,{config:{broadcast:{self:false},presence:{key}}}),st={};let me={},cb=null;
  const emit=()=>{for(const k in st)if(st[k].nm)OL.names[k]=st[k].nm;if(cb)cb({peers:Object.keys(st).map(k=>({peer:k,by:k,isMe:false,presence:st[k]}))})};
  ch.on('presence',{event:'sync'},()=>{const ps=ch.presenceState(),seen={};
    for(const k in ps){if(k===key||!ps[k].length)continue;seen[k]=1;st[k]=Object.assign(st[k]||{},ps[k][ps[k].length-1])}
    for(const k in st)if(!seen[k])delete st[k];emit()});
  ch.on('broadcast',{event:'p'},({payload})=>{if(!payload||payload.k===key)return;st[payload.k]=Object.assign(st[payload.k]||{},payload.d);emit()});
  await new Promise((res,rej)=>ch.subscribe(x=>{if(x==='SUBSCRIBED')res();else if(x==='CHANNEL_ERROR'||x==='TIMED_OUT')rej(x)}));
  return{onPeers(f){cb=f;emit()},
    presence(patch){Object.assign(me,patch);if('go' in patch||'host' in patch)ch.track({host:me.host||0,go:me.go||null,nm});else ch.send({type:'broadcast',event:'p',payload:{k:key,d:patch}});return Promise.resolve()},
    leave(){sb.removeChannel(ch)}}}
function olInit(){$('lbBtn').hidden=false;
  OL.room={join:sbJoin};$('mpBtn').hidden=false;
  setInterval(()=>{if(!OL.rm||!pl||(st!=='play'&&st!=='dead'))return;OL.rm.presence({x:Math.round(pl.x),y:Math.round(pl.y),h:+pl.h.toFixed(2),c:pcol,ty:ptype,a:st==='play'?1:0,s:score|0}).catch(()=>{})},120)}
async function submitScore(s){s=s|0;if(s<1||s>200000)return;let sb=0;try{sb=+localStorage.getItem('kacak_sbest')||0}catch(e){}if(s<=sb)return;
  const n=myName(true);if(!n)return;
  try{const r=await fetch(TB,{method:'POST',headers:{...sbh,Prefer:'return=minimal'},body:JSON.stringify({uid:myUid(),name:n,score:s,mode:mode,diff:diff,map:mp})});if(r.ok){try{localStorage.setItem('kacak_sbest',String(s))}catch(e){}}}catch(e){}}
async function showLb(){$('lb').hidden=false;const L=$('lbl');L.textContent='';
  const col=t=>{const c=document.createElement('div'),h=document.createElement('b');h.textContent=t;c.appendChild(h);L.appendChild(c);return c},row=(c,x,me)=>{const r=document.createElement('div');r.textContent=x;if(me)r.className='me';c.appendChild(r)};
  const nm={easy:'Kolay',normal:'Normal',hard:'Zor'};let a=[];try{a=JSON.parse(localStorage.getItem('kacak_top')||'[]')}catch(e){}
  const c1=col('BU CİHAZ');if(!a.length)row(c1,'Henüz skor yok');a.slice(0,7).forEach((e,i)=>row(c1,(i+1)+'. '+(e.s|0).toLocaleString('tr-TR')+' · '+(nm[e.d]||'')));
  const c2=col('DÜNYA');row(c2,'Yükleniyor...');
  try{const r=await fetch(TB+'?select=uid,name,score&order=score.desc&limit=80',{headers:sbh});if(!r.ok)throw 0;const q=await r.json(),seen={},top=[];
    for(const d of q){if(!seen[d.uid]){seen[d.uid]=1;top.push(d)}if(top.length>=7)break}
    c2.lastChild.remove();if(!top.length)row(c2,'Henüz skor yok');top.forEach((d,i)=>row(c2,(i+1)+'. '+d.name+' — '+d.score.toLocaleString('tr-TR'),d.uid===myUid()))}
  catch(e){c2.lastChild.textContent='Açılamadı'}}
</script>
