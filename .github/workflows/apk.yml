
name: APK

"on":
workflow_dispatch:
push:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 22

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - run: npm install

  - name: Prepare web assets
    run: |
      mkdir -p www
      test -f index.html
      cp index.html www/index.html

  - name: Build ads
    run: |
      test -f src/ads.js
      npx esbuild src/ads.js --bundle --format=iife --outfile=www/ads.js

  - name: Add Android
    run: npx cap add android

  - name: Patch Android
    run: python3 scripts/patch.py

  - name: Sync Android
    run: npx cap sync android

  - name: Build APK
    run: |
      chmod +x android/gradlew
      cd android
      ./gradlew assembleDebug

  - uses: actions/upload-artifact@v4
    with:
      name: kacak-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
